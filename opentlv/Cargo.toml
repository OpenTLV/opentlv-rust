[package]
name = "opentlv"
description = "Safe Rust bindings for OpenTLV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["parser-implementations", "encoding", "api-bindings"]
build = "build.rs"

[features]
default = ["lldp", "document", "nfc"]
lldp = ["opentlv-sys/lldp"]
nfc = ["opentlv-sys/nfc"]
document = ["opentlv-sys/document"]

[dependencies]
opentlv-sys = { version = "=0.1.0", path = "../opentlv-sys", default-features = false }
