name: Rust checks
on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      require_verified_core:
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
  actions: read
  security-events: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: matrix
        env:
          TIER: ${{ inputs.tier }}
        run: echo "value=$(python3 -B scripts/ci.py matrix --tier "$TIER")" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    name: Rust / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check CI shell argument handling
        run: python -B -m unittest discover -s tests -p test_ci_shell.py
      - name: Build and test the Rust workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier }}
          CONFIGURATION: ${{ matrix.id }}
          REQUIRE_RELEASE: ${{ inputs.require_verified_core }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Keep the array nonempty for macOS Bash 3.2 with nounset enabled.
          ci_command=(python -B scripts/ci.py build --tier "$TIER" --configuration "$CONFIGURATION"
            --work build/ci --output build/record.json)
          if [[ "$REQUIRE_RELEASE" == true ]]; then ci_command+=(--require-release); fi
          "${ci_command[@]}" 2>&1 | tee build/ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-${{ inputs.tier }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            build/record.json
            build/ci.log
          if-no-files-found: error
  quality:
    if: inputs.tier != 'main'
    uses: ./.github/workflows/rust-quality.yml
  codeql:
    if: inputs.tier != 'main'
    uses: ./.github/workflows/rust-codeql.yml
  gate:
    name: Rust quality gate
    if: always()
    needs: [build, quality, codeql]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-build-${{ inputs.tier }}-*-${{ github.run_attempt }}
          path: build/evidence
      - shell: bash
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ inputs.tier }}
          REQUIRE_RELEASE: ${{ inputs.require_verified_core }}
        run: |
          set -euo pipefail
          ci_command=(python3 -B scripts/ci.py gate --tier "$TIER" --evidence build/evidence
            --output build/quality.json)
          if [[ "$REQUIRE_RELEASE" == true ]]; then ci_command+=(--require-release); fi
          "${ci_command[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-quality-${{ inputs.tier }}-${{ github.run_attempt }}
          path: build/quality.json
          if-no-files-found: error
  timings:
    name: Rust timings
    if: always()
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci_timings.py --scope rust --output build/timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-timings-${{ inputs.tier }}-${{ github.run_attempt }}
          path: build/timings.json
          if-no-files-found: error
