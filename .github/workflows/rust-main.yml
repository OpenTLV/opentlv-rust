name: Rust Main CI
on:
  push:
    branches: [main]
permissions:
  contents: read
  attestations: read
  actions: read
concurrency:
  group: rust-main-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml
    permissions:
      contents: read
      attestations: read
      actions: read
      security-events: write
    with:
      tier: main
  docs_changes:
    needs: [checks]
    if: github.repository == 'OpenTLV/opentlv-rust'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record relevant changes since the previous successful Main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/docs_notification.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-notification-${{ github.run_attempt }}
          path: build/docs-notification/notification.json
          if-no-files-found: error
